input_file: "data/fit_poly_sample.csv"
input_format: "auto"
sheet_name: null

x_column: "x"
y_columns:
  - "y"

graph_type: "line_symbol"

fitting:
  enabled: true
  models:
    - name: "poly2_fit_y"
      y_column: "y"
      model: "polynomial"
      degree: 2
      output_curve_points: 100
      show_equation: true
      show_r_squared: true

graph_title: "Polynomial Fit Plot v0.7"
x_title: "X"
y_title: "Y"

style_profile: "configs/styles/lab_report_style.yaml"
export_profile: "configs/exports/default_export.yaml"

output_dir: "output/origin_plot_fitting_poly2"
output_basename: "poly2_fit"

show_origin: true
