input_file: "data/fit_poly_sample.csv"
input_format: "auto"
sheet_name: null

x_column: "x"
y_columns:
  - "y"

graph_type: "line_symbol"

fitting:
  enabled: true
  models:
    - name: "poly2_fit_y"
      y_column: "y"
      model: "polynomial"
      degree: 2
      output_curve_points: 100
      show_equation: true
      show_r_squared: true
  annotation:
    enabled: true
    include_equation: true
    include_r_squared: true
    include_model_name: true
    position: "top_left"
  summary_csv:
    enabled: true
    path: "reports/fitting_summary_poly2.csv"
    append: false
  residuals:
    export_csv: true
    generate_residual_plot: true
    output_dir: "output/origin_plot_residuals"

origin_session:
  retry_on_com_error: true
  max_retries: 1
  kill_stale_origin_before_retry: true
  retry_delay_seconds: 2

graph_title: "Polynomial Fit Plot v0.8.1"
x_title: "X"
y_title: "Y"

style_profile: "configs/styles/lab_report_style.yaml"
export_profile: "configs/exports/default_export.yaml"

output_dir: "output/origin_plot_fitting_poly2"
output_basename: "poly2_fit"

show_origin: true
